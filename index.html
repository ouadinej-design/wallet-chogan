<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c14; --surface:#16161f; --card:#1e1e2a;
  --text:#fff;  --muted:rgba(255,255,255,.48);
  --gold:#c9a84c; --gold2:#e8c870;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);
  font-family:-apple-system,'Helvetica Neue',sans-serif;color:var(--text)}

/* SCREENS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:0.38s}
.hidden{opacity:0;pointer-events:none;transform:scale(0.96)}

/* NAV */
.wallet-nav{display:flex;gap:10px;padding:15px 20px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.wallet-nav::-webkit-scrollbar{display:none}
.pill{padding:10px 18px;border-radius:25px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.15);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;transition:0.2s}
.pill.active{background:var(--gold);color:#000;border-color:var(--gold);box-shadow:0 4px 15px rgba(201,168,76,0.3)}

/* ELEVATOR / CARTES ÉLARGIES EN HAUTEUR */
.elevator{flex:1;overflow-y:auto;position:relative;padding-bottom:200px}
.elevator::-webkit-scrollbar{display:none}

.wcard{position:absolute;left:15px;right:15px;height:220px;border-radius:32px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,0.7);transition:transform 0.3s ease}
.ci{padding:30px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.ct-n{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.2;margin-top:5px}
.ct-c{font-size:12px;text-transform:uppercase;opacity:0.7;font-weight:800;letter-spacing:2px}

/* COLORS */
.t1{background:linear-gradient(135deg,#1e3a8a,#1e1b4b)}
.t2{background:linear-gradient(135deg,#581c87,#2e1065)}
.t3{background:linear-gradient(135deg,#065f46,#064e3b)}
.t4{background:linear-gradient(135deg,#854d0e,#422006)}
.t5{background:linear-gradient(135deg,#155e75,#083344)}
.t6{background:linear-gradient(135deg,#991b1b,#450a0a)}

/* SHEET */
#dpanel{position:fixed;inset:0;z-index:100;pointer-events:none}
#dov{position:absolute;inset:0;background:rgba(0,0,0,0);transition:0.4s}
#dsheet{position:absolute;bottom:0;left:0;right:0;background:#1a1a26;border-radius:35px 35px 0 0;transform:translateY(100%);transition:0.4s cubic-bezier(0.16, 1, 0.3, 1);max-height:88vh;overflow-y:auto;padding:30px}
#dpanel.open{pointer-events:all}
#dpanel.open #dov{background:rgba(0,0,0,0.8)}
#dpanel.open #dsheet{transform:translateY(0)}

.btn-g{width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,#c9a84c,#8b5e1a);border:none;color:#fff;font-size:16px;font-weight:800;margin-top:15px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.finput{width:100%;background:var(--card);border:1px solid rgba(255,255,255,0.1);border-radius:15px;padding:18px;color:#fff;margin-bottom:15px;text-align:center;font-size:18px;letter-spacing:2px}
#toast{position:fixed;top:50px;left:20px;right:20px;padding:18px;border-radius:15px;text-align:center;transform:translateY(-250%);transition:0.5s;z-index:999;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#toast.show{transform:translateY(0)}
</style>
</head>
<body>

        <div style="font-size:80px;filter:drop-shadow(0 0 15px rgba(201,168,76,0.5))">🔱</div>
        <h1 style="margin-top:25px;letter-spacing:3px;font-weight:900">CHOGAN PRO</h1>
    </div>
    <div style="padding:40px;background:var(--surface);border-radius:40px 40px 0 0">

        <button class="btn-g" onclick="tryUnlock()">DÉVERROUILLER</button>
    </div>
</div>

<div id="main" class="screen hidden">
    <div style="padding:calc(30px + var(--st)) 25px 15px;display:flex;justify-content:space-between;align-items:center">
        <h2 id="wh-title" style="font-size:28px;font-weight:900">Espace Pro</h2>
        <div onclick="avTap()" style="width:45px;height:45px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(201,168,76,0.4)">WC</div>
    </div>

    <div class="wallet-nav">
        <div class="pill active" id="p-knowledge" onclick="switchWallet('knowledge')">🧠 GUIDE VENTE</div>
        <div class="pill" id="p-products" onclick="switchWallet('products')">🛍️ PRODUITS</div>
        <div class="pill" id="p-scripts" onclick="switchWallet('scripts')">🤝 COLLABS</div>
    </div>

    <div class="elevator" id="stack"></div>
</div>

<div id="dpanel">
    <div id="dov" onclick="cls()"></div>
    <div id="dsheet">
        <div style="width:50px;height:5px;background:rgba(255,255,255,0.2);margin:0 auto 25px;border-radius:3px"></div>
        <div id="sc"></div>
    </div>
</div>

<div id="toast"></div>

<script>
const WALLETS = {
    knowledge: [
        { t: "S - Sécurité", s: "Méthode SONCAS", c: "t1", e: "🛡️", items: [
            { n: "Argument TENUE", d: "Extraits à 30% d'essence. Tenue garantie 8h à 24h sur peau et vêtements.", q: "SÉCURITÉ" },
            { n: "Argument QUALITÉ", d: "Certifications BIO, SCIC, sans paraben, non testé sur les animaux.", q: "SÉCURITÉ" },
            { n: "Argument ORIGINE", d: "Essences produites à Grasse par Fragworld, leader mondial.", q: "SÉCURITÉ" }
        ]},
        { t: "O - Orgueil", s: "Méthode SONCAS", c: "t2", e: "👑", items: [
            { n: "Argument PRESTIGE", d: "Gamme Luxury avec flacons dorés. Le luxe sans le prix marketing.", q: "ORGUEIL" },
            { n: "Argument EXCLUSIVITÉ", d: "Portez des fragrances rares que l'on ne trouve pas partout.", q: "ORGUEIL" }
        ]},
        { t: "N - Nouveauté", s: "Méthode SONCAS", c: "t3", e: "✨", items: [
            { n: "Argument INNOVATION", d: "Nouveaux catalogues réguliers et packaging modernisé.", q: "NOUVEAUTÉ" },
            { n: "Argument TENDANCE", d: "Inspirations des derniers lancements haute couture.", q: "NOUVEAUTÉ" }
        ]},
        { t: "C - Confort", s: "Méthode SONCAS", c: "t4", e: "🛋️", items: [
            { n: "Argument SERVICE", d: "Je vous livre directement. Conseil personnalisé selon vos goûts.", q: "CONFORT" },
            { n: "Argument USAGE", d: "Flacons adaptés à votre sac ou salle de bain.", q: "CONFORT" }
        ]},
        { t: "A - Argent", s: "Méthode SONCAS", c: "t5", e: "💰", items: [
            { n: "Argument PRIX", d: "Le même produit, la même odeur, mais 3 à 4 fois moins cher.", q: "ARGENT" },
            { n: "Argument ÉCONOMIE", d: "Pourquoi payer la publicité et les égéries ? Payez juste le parfum.", q: "ARGENT" }
        ]},
        { t: "S - Sympathie", s: "Méthode SONCAS", c: "t6", e: "🤝", items: [
            { n: "Argument RELATION", d: "Entreprise familiale. Soutien au commerce de proximité.", q: "SYMPATHIE" },
            { n: "Argument ÉTHIQUE", d: "Produits naturels, respectueux de l'environnement.", q: "SYMPATHIE" }
        ]}
    ],
    products: [
        { t: "Extraits de Parfums", s: "Parfumerie", c: "t1", e: "🧴", items: [
            { n: "Concentration 30%", d: "La plus haute concentration du marché.", q: "QUALITÉ" },
            { n: "Fragworld Grasse", d: "Essences créées dans la capitale mondiale du parfum.", q: "ORIGINE" }
        ]},
        { t: "Gamme Luxury", s: "Parfumerie", c: "t2", e: "💎", items: [
            { n: "Flacons de Prestige", d: "Design exclusif, finitions or et noir premium.", q: "LUXE" },
            { n: "Fragrances Uniques", d: "Essences rares pour une signature inoubliable.", q: "EXCLUSIF" }
        ]},
        { t: "Bave d'Escargot", s: "Soins Visage", c: "t3", e: "🐌", items: [
            { n: "Action Régénérante", d: "Réduit visiblement rides, taches et acné.", q: "BIO" }
        ]},
        { t: "Nettoyage Maison", s: "Entretien Pro", c: "t5", e: "🏠", items: [
            { n: "Bagnolux", d: "Anti-calcaire brillant pour robinetterie.", q: "PRO" },
            { n: "Degreaser Plus", d: "Dégraissant surpuissant HACCP.", q: "HACCP" }
        ]},
        { t: "Maquillage Pro", s: "Beauty Line", c: "t6", e: "💄", items: [
            { n: "Rouges à Lèvres", d: "Longue tenue, sans transfert.", q: "MAKE-UP" }
        ]},
        { t: "Ligne Hygiène", s: "Quotidien", c: "t1", e: "🛁", items: [
            { n: "Gels Douche", d: "L'odeur de votre parfum préféré sous la douche.", q: "PLAISIR" }
        ]}
    ],
    scripts: [
        { t: "Coiffeur / Barbier", s: "Collaboration B2B", c: "t1", e: "💇", items: [
            { n: "Argument Business", d: "Augmentez votre CA sans temps de travail supplémentaire.", q: "REVENU" },
            { n: "Collaboration", d: "Dépôt-vente ou corner boutique.", q: "PARTENARIAT" }
        ]},
        { t: "Institut de Beauté", s: "Collaboration B2B", c: "t2", e: "🧖", items: [
            { n: "Argument Business", d: "Proposez des produits bio pour le suivi à domicile.", q: "FIDÉLITÉ" },
            { n: "Collaboration", d: "Utilisation des huiles Chogan pendant les soins.", q: "QUALITÉ" }
        ]}
    ]
};

let currentWallet = 'knowledge';
let history = [];

function tryUnlock() {
    if(document.getElementById('uc').value.toUpperCase() === ACCESS_CODE) {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('main').classList.remove('hidden');
        switchWallet('knowledge');
    } else { toast("CODE INCORRECT", "#ff5050"); }
}

function switchWallet(key) {
    currentWallet = key;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.getElementById('p-'+key).classList.add('active');
    const titles = {knowledge:"Guide Vente", products:"Catalogue", scripts:"Collabs Pro"};
    document.getElementById('wh-title').textContent = titles[key];
    buildStack();
}

function buildStack() {
    const stack = document.getElementById('stack');
    stack.innerHTML = '';
    const data = WALLETS[currentWallet];
    
    data.forEach((cat, i) => {
        const card = document.createElement('div');
        card.className = `wcard ${cat.c}`;
        card.style.top = (i * 75) + "px"; // Espacement vertical augmenté
        card.style.zIndex = i;
        card.onclick = () => openCard(i);
        card.innerHTML = `<div class="ci">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div style="flex:1">
                    <div class="ct-c">${cat.s}</div>
                    <div class="ct-n">${cat.t}</div>
                </div>
                <div style="font-size:45px; opacity:0.8">${cat.e}</div>
            </div>
            <div style="font-size:11px; font-weight:900; letter-spacing:1px; color:rgba(255,255,255,0.6); display:flex; align-items:center; gap:8px">
                DÉTAILS DE LA CARTE <span style="font-size:16px">→</span>
            </div>
        </div>`;
        stack.appendChild(card);
    });
}

function openCard(idx) {
    const cat = WALLETS[currentWallet][idx];
    history.push(cat.t);
    document.getElementById('sc').innerHTML = `
        <h2 style="margin-bottom:25px; font-size:28px; color:var(--gold); line-height:1.2; font-weight:900">${cat.t}</h2>
        ${cat.items.map(it => `
            <div style="background:var(--card);padding:22px;border-radius:24px;margin-bottom:15px;border-left:6px solid var(--gold);box-shadow:0 8px 20px rgba(0,0,0,0.2)">
                <div style="font-size:11px;color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:1px">${it.q}</div>
                <div style="font-weight:800;margin:8px 0;font-size:19px;color:#fff">${it.n}</div>
                <div style="font-size:16px;color:rgba(255,255,255,0.7);line-height:1.5">${it.d}</div>
            </div>
        `).join('')}
        <button class="btn-g" onclick="cls()">RETOUR AU WALLET</button>
    `;
    document.getElementById('dpanel').classList.add('open');
}

function cls() { document.getElementById('dpanel').classList.remove('open'); }

function toast(m, c) {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.background = c;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function avTap() {
    if(confirm("Envoyer le rapport d'activité ?")) {
        try {
            await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_key: W3F_KEY, to: ADMIN_EMAIL, message: "Consultations : " + history.join(", ") })
            });
            toast("RAPPORT ENVOYÉ", "#32c864");
            history = [];
        } catch(e) { toast("ERREUR RÉSEAU", "#ff5050"); }
    }
}
</script>
