<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet Chogan">
<meta name="theme-color" content="#0c0c14">
<title>Wallet Chogan</title>

<script>
/* ╔══════════════════════════════════════════╗
   ║    🔧 CONFIGURATION À PERSONNALISER      ║
   ╚══════════════════════════════════════════╝ */

const ACCESS_CODE = "CHOGAN2024";           
const ADMIN_CODE  = "ADMIN#2025";           
const ADMIN_EMAIL = "ouadi.nej@gmail.com"; 
const W3F_KEY     = "04e1ce0c-3c62-413d-ab06-7fdfe1afd91a"; 

/* ══════════════════════════════════════════ */
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0c14; --surface:#16161f; --card:#1e1e2a;
  --text:#fff;  --muted:rgba(255,255,255,.48);
  --gold:#c9a84c; --gold2:#e8c870;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  color:var(--text);-webkit-font-smoothing:antialiased}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  transition:opacity .38s,transform .38s;overflow:hidden}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.96)}

/* COMPOSANTS FORM */
.form-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.finput{width:100%;background:var(--card);border:0.5px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;outline:none;margin-bottom:14px}
.btn-g{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#c9a84c,#8b5e1a);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer}

/* NAVIGATION */
.wallet-selector{display:flex;gap:8px;padding:10px 18px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.wallet-selector::-webkit-scrollbar{display:none}
.pill{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.12);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:0.2s}
.pill.active{background:var(--gold);color:#000;border-color:var(--gold)}

/* ASCENSEUR (Elevator) */
.elevator-container{position:relative;flex:1;display:flex;overflow:hidden}
.stack-scroll{flex:1;overflow-y:auto;padding-bottom:100px;scrollbar-width:none;position:relative}
.stack-scroll::-webkit-scrollbar{display:none}

/* CARDS */
.wcard{position:absolute;left:14px;right:14px;height:170px;border-radius:22px;overflow:hidden;transition:transform 0.3s ease;box-shadow:0 8px 25px rgba(0,0,0,0.5)}
.ci{padding:20px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.ct-n{font-size:18px;font-weight:800;letter-spacing:-.02em}
.ct-c{font-size:10px;text-transform:uppercase;opacity:.6}

/* COLORS */
.t1{background:linear-gradient(135deg,#1a3380,#0a1840)}
.t2{background:linear-gradient(135deg,#4a1580,#1a0835)}
.t3{background:linear-gradient(135deg,#0e5c3a,#052818)}
.t4{background:linear-gradient(135deg,#7a3010,#2e1005)}
.t5{background:linear-gradient(135deg,#0b5060,#031e28)}
.t6{background:linear-gradient(135deg,#7a1010,#2e0505)}

/* SHEET */
#dpanel{position:fixed;inset:0;z-index:100;pointer-events:none}
#dov{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .4s}
#dsheet{position:absolute;bottom:0;left:0;right:0;background:#1a1a26;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .4s;max-height:85vh;overflow-y:auto}
#dpanel.open{pointer-events:all}
#dpanel.open #dov{background:rgba(0,0,0,.7)}
#dpanel.open #dsheet{transform:translateY(0)}

#toast{position:fixed;top:40px;left:20px;right:20px;padding:15px;border-radius:12px;text-align:center;transform:translateY(-150%);transition:0.4s;z-index:999;font-weight:600}
#toast.show{transform:translateY(0)}
.t-ok{background:#32c864;color:#fff}
.t-er{background:#ff5050;color:#fff}
</style>
</head>
<body>

<div id="lock" class="screen">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px">
    <div style="font-size:60px">💼</div>
    <h2 style="margin-top:20px">Wallet Chogan</h2>
  </div>
  <div style="background:var(--surface);padding:30px 20px calc(30px + var(--sb));border-radius:30px 30px 0 0">
    <label class="form-label">Code d'accès</label>
    <input class="finput" id="uc" type="password" placeholder="••••••••" style="text-align:center">
    <button class="btn-g" onclick="tryUnlock()">Se connecter</button>
  </div>
</div>

<div id="main" class="screen hidden">
  <div style="padding:calc(20px + var(--st)) 20px 10px;display:flex;justify-content:space-between;align-items:center">
    <div><div id="wh-title" style="font-size:24px;font-weight:800">Catalogue</div></div>
    <div onclick="avTap()" style="width:40px;height:40px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer">WC</div>
  </div>

  <div class="wallet-selector">
    <div class="pill" id="p-knowledge" onclick="switchWallet('knowledge')">🧠 Savoir</div>
    <div class="pill active" id="p-products" onclick="switchWallet('products')">🛍️ Produits</div>
    <div class="pill" id="p-scripts" onclick="switchWallet('scripts')">📝 Scripts</div>
  </div>

  <div class="elevator-container">
    <div class="stack-scroll" id="stack"></div>
  </div>
</div>

<div id="dpanel">
  <div id="dov" onclick="cls()"></div>
  <div id="dsheet">
    <div style="width:40px;height:4px;background:rgba(255,255,255,.2);margin:12px auto;border-radius:2px"></div>
    <div id="sc" style="padding:20px"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const WALLETS = {
  knowledge: [
    { t: "Histoire de Chogan", s: "Fondements", c: "t1", e: "📜", items: [
      { n: "Origine", d: "Entreprise italienne créée en 2013.", q: "Info" },
      { n: "Partenariat Fragworld", d: "Essences produites à Grasse, leader mondial.", q: "Qualité" }
    ]},
    { t: "Traitement Objections", s: "Vente", c: "t2", e: "💬", items: [
      { n: "C'est un faux ?", d: "Non, c'est un extrait de parfum Chogan. La fragrance appartient au producteur Fragworld, pas à la marque de luxe.", q: "Argument" },
      { n: "Le prix bas ?", d: "Pas de publicité, pas de stars, pas d'intermédiaires.", q: "Argument" }
    ]}
  ],
  products: [
    { t: "Parfums Luxury", s: "Extraits 30%", c: "t3", e: "💎", items: [
      { n: "Inspiré par Jador", d: "Féminin, floral, élégant.", q: "Réf 001" },
      { n: "Inspiré par Sauvage", d: "Masculin, frais, puissant.", q: "Réf 002" }
    ]},
    { t: "Entretien Maison", s: "Hautement concentré", c: "t5", e: "🏠", items: [
      { n: "Degreaser Plus", d: "Dégraissant surpuissant alimentaire.", q: "Best-seller" },
      { n: "Bagnolux", d: "Anti-calcaire effet brillant immédiat.", q: "Top" }
    ]}
  ],
  scripts: [
    { t: "Salon de Coiffure", s: "B2B", c: "t1", e: "💇", items: [
      { n: "Argument : Revenu", d: "Gagnez 50% de marge sur chaque parfum vendu sans changer votre métier.", q: "Profit" },
      { n: "Argument : Fidélisation", d: "Offrez un échantillon après une coupe pour marquer l'esprit.", q: "Marketing" }
    ]},
    { t: "Esthéticienne", s: "B2B", c: "t2", e: "🧖", items: [
      { n: "Argument : Complément", d: "Utilisez les huiles Chogan (Neem, Argan) pendant les soins.", q: "Soin" },
      { n: "Phrase clé", d: "« Prolongez l'expérience du soin chez vous avec nos extraits de parfum. »", q: "Script" }
    ]},
    { t: "Fleuriste", s: "B2B", c: "t3", e: "💐", items: [
      { n: "Argument : Cadeau", d: "Associez un bouquet à un parfum pour un cadeau complet.", q: "Vente" }
    ]},
    { t: "Salles de Sport", s: "B2B", c: "t4", e: "🏋️", items: [
      { n: "Hygiène Luxe", d: "Gels douche parfumés pour les douches premium.", q: "Image" }
    ]},
    { t: "Agences Immo", s: "B2B", c: "t5", e: "🏠", items: [
      { n: "Marketing Olfactif", d: "Parfumez les biens pour déclencher le coup de cœur.", q: "Vente" }
    ]},
    { t: "Garages / VTC", s: "B2B", c: "t6", e: "🚗", items: [
      { n: "Expérience Client", d: "Un véhicule qui sent le luxe justifie un service premium.", q: "Service" }
    ]}
  ]
};

let currentWallet = 'products';
let history = [];

function tryUnlock() {
  if(document.getElementById('uc').value === ACCESS_CODE) {
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    switchWallet('products');
  } else { toast("Code incorrect", "er"); }
}

function switchWallet(key) {
  currentWallet = key;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.getElementById('p-'+key).classList.add('active');
  const titles = {knowledge:"Savoir", products:"Catalogue", scripts:"Collaborations"};
  document.getElementById('wh-title').textContent = titles[key];
  buildStack();
}

function buildStack() {
  const stack = document.getElementById('stack');
  stack.innerHTML = '';
  const data = WALLETS[currentWallet];
  
  data.forEach((cat, i) => {
    const card = document.createElement('div');
    card.className = `wcard ${cat.c}`;
    // L'ascenseur se crée ici par le décalage vertical
    card.style.top = (i * 50) + "px"; 
    card.style.zIndex = i;
    card.onclick = () => openCard(i);
    card.innerHTML = `<div class="ci">
      <div style="display:flex;justify-content:space-between">
        <div><div class="ct-c">${cat.s}</div><div class="ct-n">${cat.t}</div></div>
        <div style="font-size:24px">${cat.e}</div>
      </div>
      <div style="font-size:10px; opacity:0.5">TAP POUR OUVRIR</div>
    </div>`;
    stack.appendChild(card);
  });
  // Ajuster la hauteur du scroll pour l'ascenseur
  stack.style.height = (data.length * 50 + 150) + "px";
}

function openCard(idx) {
  const cat = WALLETS[currentWallet][idx];
  document.getElementById('sc').innerHTML = `
    <h2 style="margin-bottom:15px">${cat.t}</h2>
    ${cat.items.map(it => `
      <div style="background:var(--card);padding:15px;border-radius:12px;margin-bottom:10px;border-left:4px solid var(--gold)">
        <div style="font-size:10px;color:var(--gold);font-weight:bold">${it.q}</div>
        <div style="font-weight:bold;margin:5px 0">${it.n}</div>
        <div style="font-size:13px;opacity:0.7">${it.d}</div>
      </div>
    `).join('')}
    <button class="btn-g" style="margin-top:15px" onclick="cls()">Fermer</button>
  `;
  document.getElementById('dpanel').classList.add('open');
  history.push(cat.t);
}

function cls() { document.getElementById('dpanel').classList.remove('open'); }

function toast(m, type) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'show t-' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function avTap() {
  if(confirm("Envoyer le rapport de session ?")) {
    if(history.length === 0) return toast("Rien à envoyer", "er");
    try {
      await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_key: W3F_KEY, to: ADMIN_EMAIL, message: "Consultation : " + history.join(', ') })
      });
      toast("Envoyé !", "ok");
      history = [];
    } catch(e) { toast("Erreur réseau", "er"); }
  }
}
</script>
</body>
</html>
