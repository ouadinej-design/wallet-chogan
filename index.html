<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallet Chogan">
<meta name="theme-color" content="#ffffff">
<title>Wallet Chogan</title>

<script>
/* 🔧 CONFIGURATION */
const ACCESS_CODE = "CHOGAN2024";
const ADMIN_CODE  = "ADMIN#2025";
const ADMIN_EMAIL = "ouadi.nej@gmail.com";
const W3F_KEY     = "04e1ce0c-3c62-413d-ab06-7fdfe1afd91a";
</script>

<style>
/* 🎨 THÈME BLANC ÉPURÉ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;           /* Fond blanc */
  --surface:#f2f2f7;      /* Gris clair Apple pour le relief */
  --card:#ffffff;         /* Cartes blanches */
  --text:#1c1c1e;         /* Texte noir foncé */
  --muted:#8e8e93;        /* Texte gris */
  --gold:#c9a84c;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}

html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}

/* ÉCRANS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform 0.4s cubic-bezier(0.4,0,0.2,1),opacity 0.4s;z-index:10}
.hidden{opacity:0;pointer-events:none;transform:scale(0.95)}

/* NAVIGATION */
.wallet-nav{display:flex;gap:12px;padding:15px 20px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.wallet-nav::-webkit-scrollbar{display:none}
.pill{padding:10px 20px;border-radius:20px;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;transition:0.2s;border:none}
.pill.active{background:var(--text);color:#fff}

/* PILE DE CARTES (ASCENSEUR) */
.stack-container{flex:1;position:relative;margin:10px 15px;perspective:1000px}
.wcard{position:absolute;left:0;right:0;height:220px;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.08);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1), z-index 0.1s;border:1px solid rgba(0,0,0,0.05)}

.ci{padding:25px;height:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.ct-c{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:1px;opacity:0.6}
.ct-n{font-size:26px;font-weight:900;letter-spacing:-0.5px;line-height:1.1;margin-top:4px}

/* COULEURS DES CARTES */
.t1{background:linear-gradient(135deg,#f8f9fa,#e9ecef)} /* Sécurité */
.t2{background:linear-gradient(135deg,#ffffff,#f2f2f7)} /* Orgueil */
.t3{background:linear-gradient(135deg,#fdfbf7,#f5f0e1)} /* Nouveauté */

/* MODAL / SHEET */
#dpanel{position:fixed;inset:0;z-index:1000;pointer-events:none}
#dov{position:absolute;inset:0;background:rgba(0,0,0,0.4);opacity:0;transition:0.4s}
#dsheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:30px 30px 0 0;transform:translateY(100%);transition:0.4s cubic-bezier(0.16,1,0.3,1);max-height:85vh;overflow-y:auto;padding:30px;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
#dpanel.open{pointer-events:all}
#dpanel.open #dov{opacity:1}
#dpanel.open #dsheet{transform:translateY(0)}

/* BOUTONS */
.btn-g{width:100%;padding:18px;border-radius:16px;background:#1c1c1e;border:none;color:#fff;font-size:16px;font-weight:700;margin-top:15px}
.finput{width:100%;background:var(--surface);border:none;border-radius:14px;padding:16px;color:var(--text);margin-bottom:15px;text-align:center;font-size:16px}

#toast{position:fixed;top:50px;left:20px;right:20px;padding:15px;border-radius:12px;text-align:center;transform:translateY(-200%);transition:0.4s;z-index:9999;font-weight:700;color:#fff}
#toast.show{transform:translateY(0)}
</style>
</head>
<body>

<div id="lock" class="screen">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:80px">💼</div>
        <h1 style="margin-top:20px;font-weight:900">CHOGAN PRO</h1>
    </div>
    <div style="padding:40px;background:var(--surface);border-radius:40px 40px 0 0">
        <input class="finput" id="uc" type="password" placeholder="CODE ACCÈS">
        <button class="btn-g" onclick="tryUnlock()">DÉVERROUILLER</button>
    </div>
</div>

<div id="main" class="screen hidden">
    <div style="padding:calc(20px + var(--st)) 25px 10px;display:flex;justify-content:space-between;align-items:center">
        <h2 id="title" style="font-size:28px;font-weight:900">Catalogue</h2>
        <div onclick="adminTap()" style="width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900">WC</div>
    </div>

    <div class="wallet-nav">
        <div class="pill active" id="p-knowledge" onclick="switchTab('knowledge')">🧠 GUIDE VENTE</div>
        <div class="pill" id="p-products" onclick="switchTab('products')">🛍️ PRODUITS</div>
        <div class="pill" id="p-scripts" onclick="switchTab('scripts')">🤝 COLLABS</div>
    </div>

    <div class="stack-container" id="stack"></div>
</div>

<div id="dpanel">
    <div id="dov" onclick="closeSheet()"></div>
    <div id="dsheet">
        <div style="width:40px;height:5px;background:#e5e5ea;margin:0 auto 20px;border-radius:10px"></div>
        <div id="sc"></div>
    </div>
</div>

<div id="toast"></div>

<script>
const DATA = {
    knowledge: [
        { t: "S - Sécurité", s: "SONCAS", c: "t1", e: "🛡️", items: [{n:"Argument", d:"Extraits à 30%, certifié BIO et SCIC."}] },
        { t: "O - Orgueil", s: "SONCAS", c: "t2", e: "👑", items: [{n:"Luxe", d:"Le prestige de Grasse sans le prix marketing."}] },
        { t: "N - Nouveauté", s: "SONCAS", c: "t3", e: "✨", items: [{n:"Innovation", d:"Nouveaux flacons et fragrances chaque mois."}] },
        { t: "C - Confort", s: "SONCAS", c: "t1", e: "🛋️", items: [{n:"Service", d:"Livraison directe et conseil personnalisé."}] },
        { t: "A - Argent", s: "SONCAS", c: "t2", e: "💰", items: [{n:"Prix", d:"3 à 4 fois moins cher que les parfumeries classiques."}] },
        { t: "S - Sympathie", s: "SONCAS", c: "t3", e: "🤝", items: [{n:"Éthique", d:"Produits non testés sur les animaux, naturels."}] }
    ],
    products: [
        { t: "Parfumerie Expert", s: "Catégorie 1", c: "t1", e: "🧴", items: [{n:"Extraits", d:"Plus de 130 inspirations célèbres à 30% d'essence."}] },
        { t: "Bave d'Escargot", s: "Catégorie 2", c: "t2", e: "🐌", items: [{n:"Soin", d:"Régénérant puissant pour rides et acné."}] },
        { t: "Entretien Maison", s: "Catégorie 3", c: "t3", e: "🏠", items: [{n:"HACCP", d:"Gamme pro Bagnolux et Degreaser."}] }
    ],
    scripts: [
        { t: "Coiffeurs", s: "B2B", c: "t1", e: "💇", items: [{n:"Collaboration", d:"Dépôt-vente pour augmenter le panier moyen."}] },
        { t: "Instituts", s: "B2B", c: "t2", e: "🧖", items: [{n:"Collaboration", d:"Complément de soins avec nos gammes BIO."}] }
    ]
};

let currentTab = 'knowledge';

function tryUnlock() {
    if(document.getElementById('uc').value.toUpperCase() === ACCESS_CODE) {
        document.getElementById('lock').classList.add('hidden');
        document.getElementById('main').classList.remove('hidden');
        renderStack();
    } else { showToast("CODE INCORRECT", "#ff3b30"); }
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.getElementById('p-'+tab).classList.add('active');
    renderStack();
}

function renderStack() {
    const container = document.getElementById('stack');
    container.innerHTML = '';
    const items = DATA[currentTab];
    items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = `wcard ${item.c}`;
        card.style.top = (i * 50) + 'px';
        card.style.zIndex = i;
        card.onclick = () => openCard(item);
        card.innerHTML = `
            <div class="ci">
                <div><div class="ct-c">${item.s}</div><div class="ct-n">${item.t}</div></div>
                <div style="font-size:40px;align-self:flex-end">${item.e}</div>
            </div>`;
        container.appendChild(card);
    });
}

function openCard(item) {
    document.getElementById('sc').innerHTML = `
        <h2 style="font-size:24px;margin-bottom:20px">${item.t}</h2>
        ${item.items.map(it => `
            <div style="background:var(--surface);padding:15px;border-radius:12px;margin-bottom:10px">
                <div style="font-weight:800;font-size:14px">${it.n}</div>
                <div style="font-size:14px;color:var(--muted)">${it.d}</div>
            </div>
        `).join('')}
        <button class="btn-g" onclick="closeSheet()">FERMER</button>
    `;
    document.getElementById('dpanel').classList.add('open');
}

function closeSheet() { document.getElementById('dpanel').classList.remove('open'); }

function showToast(m, c) {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.background = c;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function adminTap() {
    const code = prompt("Code ADMIN requis :");
    if(code === ADMIN_CODE) alert("Mode Admin activé (Statistiques envoyées)");
}
</script>
</body>
</html>
